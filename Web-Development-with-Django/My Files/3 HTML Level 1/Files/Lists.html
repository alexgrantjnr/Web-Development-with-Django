<!DOCTYPE html>
<html>
  <head>
    <title>Lists</title>
  </head>
  <body>
    <h1>This is the List Exercise</h1>
    <!--Ordered Lists for numbers-->
    <ol>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ol>
    <br></br>
    <!--Unordered Lists for bullets-->
    <ul>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ul>
    <br></br>
    <!--Nested Lists-->
    <ol>
        <li>First Item
            <ul>
                <li>Sub-item 1</li>
                <li>Sub-item 2</li>
            </ul>
        </li>
        <li>Second Item</li>
          <ul>
                <li>Sub-item 1</li>
                <li>Sub-item 2</li>
            </ul>
        <li>Third Item</li>
          <ul>
                <li>Sub-item 1</li>
                <li>Sub-item 2</li>
            </ul>
    </ol>   

  </body>
</html>
