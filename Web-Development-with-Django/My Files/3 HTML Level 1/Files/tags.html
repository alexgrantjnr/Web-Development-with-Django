<!DOCTYPE html>
<html>
  <head>
    <title>Tags</title>
  </head>
  <body>

    <!-- This is a comment -->
    <h1>This is the Heading 1</h1>
    <h2>This is a Heading 2</h2>
    <h3>This is a Heading 3</h3>
    <h6>This is a Heading 6</h6>
<br></br>
    <p>This is a simple paragraph.</p>
    <p>This is line Two</p>
    <p>This is line Three</p>
<br></br>
    <!--Old way -->
    <p><b>This is text in BOLD using (b) </b></p>
    <p><i>This is text in ITALIC using (i)</i></p>

<br></br>
     <!--new way -->
    <p><strong>This is text in BOLD using (strong)</strong></p>
    <p><en>This is text in ITALIC using (en)</en></p>

  </body>
</html>
