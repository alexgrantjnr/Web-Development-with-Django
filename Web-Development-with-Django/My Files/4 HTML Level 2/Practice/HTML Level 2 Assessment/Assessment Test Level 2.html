<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Test Level 2</title>
</head>

<body>
    <h1>Course Sign Up Page</h1>
        <p>Please Note First Name, Last Name, Password and Email are required</p>
    <form action="thankyou.html" method="get">

        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="First Name" required>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Last Name" required>

        <br>
        <br>

        <Label for="email">Email:</Label>
        <input type="email" id="email" name="email" placeholder="Email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Password" required>

        <br>

        <p>Are you over the age of 18?</p>
        <label for="yes">Yes</label>
        <input type="radio" id="yes" name="age" value="yes">

        <label for="no">No</label>
        <input type="radio" id="no" name="age" value="no">

        <p>Do you have a Credit Card or PayPal?</p>
        <select name="payment" id="payment">
            <option value="creditcard">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select>

        <input type="submit" name="" value="Submit Feedback" method="get">

      
    </form>
</body>

</html>
