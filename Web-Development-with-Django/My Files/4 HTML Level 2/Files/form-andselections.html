<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form and Selections</title>
</head>

<body>
    <h1>Hotel Feed Back Form</h1>
    <form method="get">
        <h3>Are you from inside Ireland or outside Ireland?</h3>
        <label for="inire">Inside</label>
        <input id="inire" type="radio" name="loc" value="inside">

        <label for="outire">Outside</label>
        <input id="outire" type="radio" name="loc" value="outside">

        <h3>How was your service</h3>
        <select name="sStars">
            <option value="Great">3</option>
            <option value="Ok">2</option>
            <option value="Bad">1</option>
        </select>
        <input type="submit" name="" value="Submit">
           <p>Any Other feedback</p>
           <textarea name="feedback" rows="5" cols="30" placeholder="Enter your feedback here"></textarea>
    </form>
</body>

</html>
