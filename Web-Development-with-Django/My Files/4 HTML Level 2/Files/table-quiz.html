<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Quiz</title>
</head>
<h1>Table Quiz</h1>

<body>
    <table border="1">
        <thead>
            <th>Country Name</th>
            <th>Country Flag</th>
            <th>GDP (millions of USD)</th>
        </thead>
        <tr>
            <td>United States</td>
            <td><img src="images/usa-flag.png" alt="United States Flag" width="100" height="50"></td>
            <td>21,427,000</td>
        </tr>

        <tr>
            <td>Ireland</td>
            <td><img src="images/ireland-flag.png" alt="Ireland Flag" width="100" height="50"></td>
            <td>1,000,000</td>
        </tr>

        <tr>
            <td>Jamaica</td>
            <td><img src="Images/jamacia-flag.png" alt="Jamaica Flag" width="100" height="50"></td>
            <td>15,000</td>
        </tr>
    </table>
</body>

</html>
