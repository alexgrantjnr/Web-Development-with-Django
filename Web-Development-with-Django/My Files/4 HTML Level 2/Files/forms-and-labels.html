<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and Labels</title>
</head>

<body>
    <!--Formas with labels and actions-->
    <h1>Forms and Labels</h1>
    <!--Enter your email address click submit and the action will bring you to facebook.com-->
    <form action="https://www.facebook.com" method="get">
        <p>Enter your email address</p>
        <input type="email" name="useremail" placeholder="Email address" required>
        <input type="submit" name="" value="Submit">
    </form>
    <br>
    <!--Form with labels that has no for attribute will have to repeat the text for Enter Text-->
    <form>
        <label>
            Enter Text:
            <input type="text" name="" placeholder="Block 1" required>
        </label>

        <label>
            Enter Text:
            <input type="text" name="" placeholder="Block 2 " required >
        </label>

    </form>
    <br>
    <!--Form with labels that has for attribute in lable and for attribute in input
     we  will not have to repeat the text for Enter Text-->
    <form>
        <label for="userinput">Enter Text:</label>
        <input type="text" id="userinput" name="" placeholder="Block 1" required>
    </form>
</body>

</html>
