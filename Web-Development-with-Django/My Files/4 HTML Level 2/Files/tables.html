<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!--Table-->
    <table border="1">
        <thread>
            <!--Table Headers-->
            <th>Number</th>
            <th>Colour</th>
            <th>Country</th>
        </thread>
        <tr>
            <!--Table rows-->
            <td>1</td>
            <td>Red</td>
            <td>USA</td>
        </tr>
        <tr>
            <!--Table rows-->
            <td>2</td>
            <td>Blue</td>
            <td>Canada</td>
        </tr>
    </table>

</body>
</html>
